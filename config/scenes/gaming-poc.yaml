name: gaming-poc
video:
  base_width: 3840
  base_height: 2160
  output_width: 3840
  output_height: 2160
  fps: 30
sources:
  main:
    source_name: StreamOps Desktop POC
    role: main
    layer: 0
    fit: stretch
    managed: true
    input_kind: monitor_capture
    settings:
      monitor_id: auto
      method: 2
      capture_cursor: true
      force_sdr: false
  overlay:
    source_name: StreamOps Clock POC
    role: overlay
    layer: 1
    anchor: bottom_right
    width_percent: 22
    margin_right: 80
    margin_bottom: 80
    managed: true
    input_kind: browser_source
    settings:
      is_local_file: true
      local_file: obs/assets/clock-overlay.html
      width: 845
      height: 475
