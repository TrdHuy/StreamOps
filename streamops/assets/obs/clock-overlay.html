<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamOps Clock Overlay</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      background: transparent;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      display: grid;
      place-items: stretch;
      padding: 20px;
    }

    .panel {
      display: grid;
      align-content: center;
      gap: 18px;
      width: 100%;
      height: 100%;
      padding: 34px 38px;
      border: 3px solid rgba(255, 255, 255, 0.82);
      border-radius: 34px;
      color: #f8fbff;
      background:
        radial-gradient(circle at 15% 15%, rgba(66, 211, 255, 0.44), transparent 34%),
        linear-gradient(135deg, rgba(5, 13, 22, 0.92), rgba(9, 39, 53, 0.82));
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.58);
    }

    .label {
      color: rgba(255, 255, 255, 0.76);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .time {
      font-size: 92px;
      font-variant-numeric: tabular-nums;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 0.92;
      text-shadow: 0 5px 24px rgba(0, 0, 0, 0.48);
    }

    .elapsed {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 14px 22px;
      border: 2px solid rgba(255, 255, 255, 0.58);
      border-radius: 999px;
      color: #d7fbff;
      background: rgba(255, 255, 255, 0.11);
      font-size: 42px;
      font-variant-numeric: tabular-nums;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <main class="panel" aria-label="StreamOps live clock">
    <div class="label">Live clock</div>
    <div id="time" class="time">--:--:--</div>
    <div id="elapsed" class="elapsed">T+00:00</div>
  </main>

  <script>
    const startedAt = performance.now();
    const timeNode = document.getElementById("time");
    const elapsedNode = document.getElementById("elapsed");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function render() {
      const now = new Date();
      const elapsedSeconds = Math.floor((performance.now() - startedAt) / 1000);
      const minutes = Math.floor(elapsedSeconds / 60);
      const seconds = elapsedSeconds % 60;

      timeNode.textContent = [now.getHours(), now.getMinutes(), now.getSeconds()].map(pad).join(":");
      elapsedNode.textContent = `T+${pad(minutes)}:${pad(seconds)}`;
      window.requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
