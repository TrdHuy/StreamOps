<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StreamOps Node</title>
    <link rel="stylesheet" href="/assets/app.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">StreamOps Node</div>
      <div class="node-status" aria-live="polite">
        <span id="status-dot" class="status-dot"></span>
        <span id="status-text">Connecting</span>
      </div>
    </header>

    <main>
      <section class="capture-stage" aria-label="Latest screen capture">
        <div id="empty-state" class="empty-state">No capture yet</div>
        <img id="preview" alt="Latest screen capture" hidden>
      </section>

      <section class="capture-controls">
        <div class="capture-details" aria-live="polite">
          <strong id="capture-time">Waiting for first capture</strong>
          <span id="capture-resolution">--</span>
        </div>
        <button id="capture-button" type="button">Capture Screen</button>
      </section>

      <p id="error-message" class="error-message" role="alert" hidden></p>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
